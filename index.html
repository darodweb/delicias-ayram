<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda Online</title>
<meta name="description" content="" id="metaDesc">
<meta name="robots" content="index, follow">
<link rel="canonical" href="" id="canonical">
<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="" id="ogTitle">
<meta property="og:description" content="" id="ogDesc">
<meta property="og:image" content="" id="ogImage">
<meta property="og:url" content="" id="ogUrl">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="" id="ogSiteName">
<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="" id="twTitle">
<meta name="twitter:description" content="" id="twDesc">
<meta name="twitter:image" content="" id="twImage">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Pinyon+Script&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== CLOSED BANNER ===== -->
<div id="closedBanner" class="closed-banner" style="display:none">
  <div class="closed-banner-inner">
    <span class="closed-banner-icon">🕐</span>
    <div>
      <span class="closed-banner-title">En este momento estamos cerrados</span>
      <button class="closed-banner-link" onclick="openScheduleModal()">Hacé clic para consultar nuestros horarios</button>
    </div>
  </div>
</div>

<!-- ===== SCHEDULE MODAL ===== -->
<div class="schedule-modal-overlay" id="scheduleModal" onclick="if(event.target===this)closeScheduleModal()">
  <div class="schedule-modal">
    <div class="schedule-modal-header">
      <span class="schedule-modal-title">Horarios de atención</span>
      <button class="close-btn" onclick="closeScheduleModal()">✕</button>
    </div>
    <div id="scheduleModalContent" class="schedule-modal-body"></div>
  </div>
</div>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-inner">
    <div class="store-name-link" onclick="backToCategories()">
      <img src="branding/logo.png" alt="Delicias AYRAM" class="store-logo">
      <h1 class="store-name" id="storeName" style="display:none"></h1>
    </div>
    <button class="cart-btn" onclick="openCart()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Carrito
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- hidden — preserves heroTitle / heroSubtitle for JS compatibility -->
<div style="display:none" aria-hidden="true">
  <h1 id="heroTitle"></h1>
  <p id="heroSubtitle"></p>
</div>

<!-- ===== MAIN ===== -->
<main>
  <div id="errorBanner" style="display:none"></div>
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>
  <div id="storeContent" style="display:none">

    <!-- ── Categories Home View ─────────────────────────── -->
    <div id="categoriesView">
      <div class="section-heading">Categorías</div>
      <div class="cat-cards-grid" id="categoryCardsGrid"></div>
    </div>

    <!-- ── Products View ────────────────────────────────── -->
    <div id="productsView" style="display:none">
      <div class="products-nav">
        <button class="back-btn" onclick="backToCategories()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Categorías
        </button>
        <span class="products-cat-label" id="productsCatLabel"></span>
      </div>
      <div class="categories" id="categoriesBar" style="margin-bottom:1rem"></div>
      <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="last-updated" style="margin-top:1.2rem">
      Actualizado: <span id="lastUpdated">—</span>
      <button class="refresh-btn" onclick="loadProducts()">↻ Actualizar</button>
    </div>

  </div>
</main>

<!-- ===== CART MODAL ===== -->
<div class="modal-overlay" id="cartModal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Tu pedido</span>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="checkout-form" id="checkoutForm" style="display:none">
      <div class="form-section-label">Datos de contacto</div>
      <div class="form-row">
        <div class="form-group">
          <label>Tu nombre *</label>
          <input type="text" id="clientName" placeholder="Ej: María García">
        </div>
        <div class="form-group">
          <label>Teléfono *</label>
          <input type="text" id="clientPhone" placeholder="351 123-4567">
        </div>
      </div>

      <div class="form-section-label" style="margin-top:0.6rem">Entrega y pago</div>
      <div class="form-row">
        <div class="form-group">
          <label>Forma de entrega *</label>
          <select required id="deliveryMethod">
            <option value="retiro">Retiro en local</option>
            <option value="envio">Envío a domicilio</option>
          </select>
        </div>
        <div class="form-group">
          <label>Forma de pago *</label>
          <select required id="paymentMethod">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia bancaria</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="addressGroup" style="display:none">
        <label>Dirección de envío *</label>
        <input type="text" id="clientAddress" placeholder="Calle, número, piso">
      </div>

      <div class="form-group">
        <label>Notas adicionales</label>
        <textarea id="notes" placeholder="Aclaraciones, horarios, referencias, etc."></textarea>
      </div>

      <button class="whatsapp-btn" onclick="sendToWhatsApp()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Enviar pedido por WhatsApp
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="index.js" defer></script>

<footer style="text-align:center;padding:1.25rem;font-size:0.78rem;color:var(--text-3,#9ca3af);letter-spacing:0.04em;opacity:0.7;">
  Hecho con <span style="color:#e05c7a;font-size:0.9rem;">❤️</span> por <a href="https://wa.me/5493547604687?text=Hola%20Daniel.%20Estoy%20interesado(a)%20en%20un%20sitio%20para%20mi%20negocio." target="_blank" rel="noopener" style="color:inherit;text-decoration:none;border-bottom:1px dotted currentColor;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity=''">DR</a>
</footer>

</body>
</html>
